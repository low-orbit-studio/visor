# Theme with no color-scheme field. Resolves to adaptive (back-compat), so the
# gate must SKIP — existing themes are never failed by the gate.
name: no-scheme-theme
version: 1
group: Visor

colors:
  primary: "#1798ad"
  neutral: "#71717a"
  background: "#ffffff"
  surface: "#ffffff"

colors-dark:
  background: "#09090b"
  surface: "#18181b"
