# Fully-bound component-token fixture (VI-625).
#
# Every token in the contract, bound to a deliberately loud value. Used by the
# theme-engine emission tests and by scripts/component-token-parity.ts to prove
# the D4 inverse: a theme that binds everything visibly changes every consuming
# surface. Regenerate by hand when the contract grows — the contract test names
# any token this file misses.

