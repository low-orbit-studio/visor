name: Visor Publish Smoke

# Borealis publish gate: VI- ticket "Done" should require that the artifact
# is reachable via `npx visor add <name>`. The smoke compares this repo's
# locally-built registry against the registry shipped in the latest
# published @loworbitstudio/visor tarball, and every file shipped by
# visor-core, visor-theme-engine and visor-tailwind-preset against their
# latest tarballs (VI-649). Any per-file content drift fails the job.
#
# No untrusted inputs are interpolated into run: steps — only the GitHub-
# controlled event_name, workflow_run.conclusion, workflow_run.head_sha and
# workflow_run.head_commit.message fields are referenced, all inside `if:`
# conditionals or `with:` inputs (never in shell).
#
# See: scripts/visor-publish-smoke.mjs, VI-305

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — drift surfaces within ~24h of a missed publish.
    - cron: "0 6 * * *"
  workflow_run:
    # Run immediately after a successful Release that published. Most Release
    # runs only open or refresh the Version Packages PR and publish nothing;
    # the job `if:` below skips those (VI-780). We wait until npm's CDN serves
    # the released versions before querying it.
    workflows: ["Release"]
    types:
      - completed

concurrency:
  group: visor-publish-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Compare local registry against latest published
    # On workflow_run, run only after a Release that succeeded AND published.
    # Release publishes only when its push is the Version Packages merge, whose
    # squash subject starts with "Version Packages" (scripts/compute-release-
    # title.mjs). Any other Release only refreshed that PR, so main carries
    # merged-but-unreleased work and drift there is expected (VI-780).
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           startsWith(github.event.workflow_run.head_commit.message, 'Version Packages')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The audit step posts a comment on each PR that landed a drifted
      # primitive — pull-requests:write is the minimum scope for that.
      contents: read
      pull-requests: write

    steps:
      - name: Checkout released commit (workflow_run) or main
        # Fetch full history so the audit step can walk `git log` per drifted
        # file. Shallow clones would mask the touching commits.
        uses: actions/checkout@v4
        with:
          # After a Release, check out the exact commit it published, so a PR
          # merged while it ran cannot show up as drift (VI-780). The schedule
          # and manual runs check main: work merged and unreleased for a day
          # is a real signal.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # The CLI's `build:manifest` imports @loworbitstudio/visor-theme-engine,
      # which resolves through the workspace symlink to packages/theme-engine —
      # whose dist/ is a build artifact that `npm ci` does not produce. Building
      # packages/cli alone therefore fails at ERR_MODULE_NOT_FOUND, and every
      # step below is skipped, so the smoke silently never ran between
      # 2026-06-04 (when VI-505 added that import) and VI-642. Same package list
      # as the CI test shards, which is why CI stayed green throughout.
      # tailwind-preset is built too: the smoke diffs its dist/ against its
      # published tarball (VI-649).
      - name: Build published packages (registry.json + every package dist/)
        run: npm run build -w packages/theme-engine -w packages/tokens -w packages/tailwind-preset -w packages/cli

      - name: Wait until npm serves the released versions
        # A fixed wait was not enough: after 1.52.0 the smoke still read 1.51.0
        # as latest and reported drift that was gone two minutes later (VI-780).
        # Poll until npm's `latest` for every published package equals the
        # version in the checked-out package.json, up to 10 minutes.
        if: github.event_name == 'workflow_run'
        run: |
          for _ in $(seq 1 60); do
            pending=""
            for dir in packages/cli packages/tokens packages/theme-engine packages/tailwind-preset; do
              name=$(node -p "require('./$dir/package.json').name")
              want=$(node -p "require('./$dir/package.json').version")
              have=$(npm view "$name" version 2>/dev/null || true)
              [ "$have" = "$want" ] || pending="$pending $name@$want(npm:$have)"
            done
            if [ -z "$pending" ]; then echo "npm serves every released version."; exit 0; fi
            echo "Waiting on:$pending"
            sleep 10
          done
          echo "::warning::npm did not serve the released versions within 10 minutes:$pending"

      - name: Run publish smoke
        id: smoke
        continue-on-error: true
        run: npm run smoke:publish

      - name: Audit drifted VI- tickets
        # When smoke detects drift, map each drifted primitive back to its
        # most recent touching commit, extract VI-N refs + PR number, and
        # post a comment on each affected PR via the built-in GITHUB_TOKEN.
        # Closes the governance loop from VI-306 without putting any
        # external API keys (Linear, Slack) into a public repo's secrets.
        # Only GitHub-controlled inputs (steps.smoke.outcome) are referenced
        # in `if:`. GITHUB_TOKEN is passed via env, never interpolated into
        # the run: shell — no injection surface.
        if: steps.smoke.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tolerate exit 1 (drift detected — expected here) but surface
          # anything else so genuine audit errors don't get masked.
          set +e
          node scripts/visor-publish-audit.mjs --post-comments
          EXIT=$?
          set -e
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 1 ]; then
            exit "$EXIT"
          fi

      - name: Surface smoke outcome
        # Re-raise the smoke step's exit code so the job still fails on drift.
        if: steps.smoke.outcome == 'failure'
        run: exit 1
