name: Admin Tabbed Editor
description: Full-page editor with horizontal tabs, tab-scoped content panels, and a sticky save/cancel footer. Composes PageHeader, Tabs, Button, and ConfirmDialog. Tab switching and cancel are protected by an unsaved-changes guard, save supports async with pending state.
category: admin
preview_url: "https://visor.design/docs/blocks/admin-tabbed-editor"
components_used:
  - page-header
  - tabs
  - button
  - confirm-dialog
when_to_use:
  - Full-page record editors where settings span multiple logical sections
  - Profile editors, settings pages, resource configuration pages
  - Any editor that benefits from a single global save across multiple tab panels
when_not_to_use:
  - Inline single-record edits (use admin-detail-drawer)
  - Multi-step forms with a linear progression (use admin-wizard)
  - Pages without meaningful grouping (use a plain form)
tab_switching_state: |
  Each TabsContent stays mounted between switches (Radix Tabs default), so per-tab React state is preserved when switching tabs. The block does not unmount tab bodies. Consumers own their draft state and are responsible for resyncing after save.
header_pass_through: |
  The block forwards editorial-scale props straight to its internal PageHeader so consumers can tune title scale per-recipe instead of forking:
  - headerSize → PageHeader `size` ("sm" | "md" | "lg"; vertical rhythm)
  - titleSize → PageHeader `titleSize` ("default" | "marquee", or a raw CSS length)
  - titleFamily → PageHeader `titleFamily` ("heading" | "display", or a raw CSS family)
  - leading → PageHeader `leading` (title line-height; unitless number or CSS length)
  All four are optional; omitting them keeps every existing call site pixel-identical.
