name: Profile Menu
description: Sidebar-footer profile menu — avatar + identity row + upward-opening dropdown of account, notifications, appearance, keyboard, help, and sign-out items. Drop-in for the AdminShell sidebarFooter slot; with `trigger="avatar"`, a top bar's account menu on Popover's skin.
category: admin
components_used:
  - avatar
  - dropdown-menu
when_to_use:
  - Admin and dashboard apps with persistent sidebar navigation
  - The sidebar footer area of `AdminShell` — drop into the `sidebarFooter` prop
  - Anywhere you need a Mac-style user menu with shortcuts, badges, and a destructive sign-out
  - A top bar's account menu — `trigger="avatar"` gives the round avatar alone, opening downward into Popover's skin, glass under `data-glass="on"`
when_not_to_use:
  - Public marketing pages (no signed-in user context)
  - Single-action sign-out buttons (use `Button` with `variant="ghost"` instead)
  - Loading or skeleton states (consumer renders their own skeleton until user data is ready)
