# VI-625 — the operator's two-theme side-by-side, theme B.
#
# A *realistic* binding of the component-token contract: the "editorial admin"
# look the AN-366 retro kept describing and every Animal page kept re-deriving in
# local CSS — mono all-caps table headers, squared chips and controls, flush
# borderless surfaces, a tight vertical rhythm.
#
# The whole point of the side-by-side is that this file is the ONLY difference.
# The markup rendered under it is byte-identical to the markup rendered under a
# theme that binds nothing, and there is no local CSS anywhere.
#
# Not a shipped theme — an audit artifact. Stock Visor themes deliberately bind
# no component tokens (asserted in packages/theme-engine/src/__tests__/component-tokens.test.ts),
# because changing a DEFAULT would move pixels for every project on a Visor theme.

name: editorial-admin
version: 1
group: Fixture

colors:
  primary: "#6beba5"
  neutral: "#333333"
  background: "#0a0a0c"
  surface: "#111115"

components:
  # Chrome-style header: mono, all-caps, a step smaller, tracked out, and a
  # recessed well rather than a transparent strip.
  table:
    head-height: "2.25rem"
    head-font-family: '"IBM Plex Mono", ui-monospace, monospace'
    head-font-size: "11px"
    head-font-weight: "600"
    head-letter-spacing: "0.08em"
    head-text-transform: "uppercase"
    head-padding-x: "1.25rem"
    head-bg:
      light: "#eceef1"
      dark: "#16161b"
    cell-padding: "1rem 1.25rem"
    cell-font-size: "13px"
    row-border: "1px solid transparent"
    cell-border-top: "1px solid rgba(127, 127, 140, 0.16)"
    footer-bg: "transparent"
    caption-color: "#7f7f8c"
    row-hover-bg:
      light: "#f4f5f7"
      dark: "#1b1b21"
    row-selected-bg:
      light: "#e8faf1"
      dark: "#152119"

  data-table:
    container-radius: "0"
    container-shadow: "none"
    row-py: "1rem"
    cell-px: "1.25rem"

  # One chip treatment, everywhere. This is the family the retro measured at
  # five different sizes and five different tracking values.
  chip:
    radius: "4px"
    md-height: "1.75rem"
    md-padding-x: "0.625rem"
    md-font-size: "11px"
    sm-height: "1.5rem"
    sm-padding-x: "0.5rem"
    sm-font-size: "10px"
    lg-height: "2rem"
    lg-padding-x: "0.75rem"
    lg-font-size: "12px"
    font-weight: "600"
    letter-spacing: "0.06em"
    text-transform: "uppercase"
    border: "1px solid transparent"
    bg:
      light: "#eceef1"
      dark: "#1b1b21"
    selected-bg:
      light: "#d6f7e6"
      dark: "#16301f"
    selected-border-color: "transparent"
    selected-text-color: "#2f9d6b"

  badge:
    radius: "4px"
    font-size: "11px"
    font-weight: "600"
    letter-spacing: "0.06em"
    text-transform: "uppercase"
    md-padding: "0.1875rem 0.5rem"

  status-badge:
    dot-size: "0.375rem"
    dot-radius: "1px"
    mono-letter-spacing: "0.06em"

  checkbox:
    size: "1.125rem"
    radius: "4px"

  # The operator's named case: one filter bar, not one per page.
  filter-bar:
    radius: "0"
    border: "0"
    padding: "0 0 1rem"
    gap: "0.75rem"
    bg: "transparent"
    control-radius: "4px"
    results-font-size: "11px"

  page-header:
    gap: "0.75rem"
    title-font-size: "1.75rem"
    title-letter-spacing: "-0.02em"
    eyebrow-font-size: "10px"
    eyebrow-letter-spacing: "0.14em"
    description-font-size: "13px"

  tabs:
    list-radius: "0"
    list-bg: "transparent"
    list-padding: "0"
    list-height: "auto"
    trigger-radius: "0"
    trigger-font-size: "11px"
    trigger-letter-spacing: "0.08em"
    trigger-text-transform: "uppercase"
    trigger-padding: "0.5rem 0.875rem"
    trigger-active-bg: "transparent"
    trigger-active-shadow: "none"
    indicator-height: "2px"
    indicator-color: "#6beba5"

  banner:
    radius: "4px"
    border-width: "0"
    shadow: "none"
    padding: "0.75rem 1rem"
    description-font-size: "12px"

  empty-state:
    radius: "0"
    border: "0"
    bg: "transparent"
    padding: "3rem 1.5rem"
    icon-size: "48px"
    icon-radius: "6px"
    heading-font-size: "13px"
    description-font-size: "12px"

  sidebar:
    item-radius: "4px"
    item-height: "2rem"
    item-font-size: "13px"
    item-padding: "0 0.625rem"
    menu-gap: "0.125rem"
    group-label-font-size: "10px"
    group-label-letter-spacing: "0.14em"
    group-label-text-transform: "uppercase"
    group-label-height: "1.75rem"

  skeleton:
    radius: "3px"
    line-heading-height: "14px"
    line-body-height: "10px"
    avatar-size: "32px"

  spinner:
    md-size: "18px"
    sm-size: "14px"
    xs-size: "10px"
