# Paper — Low Orbit's shared theme (VI-749). Light is "Paper", dark is "Paper at night".
# Colours, project hues, Satoshi and the style rules come from flight-deck-ios
# spec/codified-tokens.css and spec/style-rules.md. Flight Deck and the Studio admin both read it.
#
# Paper desk: the desktop density scale drawn in the approved Studio admin frames (LO-326).
# Flight Deck keeps its iPhone sizes in its own tokens. Desk roles ship as --paper-* tokens:
#   --paper-desk-title     900 34/38   screen titles
#   --paper-desk-title-2   900 22/27   section titles
#   --paper-desk-row       600 15/20   row titles
#   --paper-desk-body      500 14/20   body
#   --paper-desk-sub       400 13/18   second lines
#   --paper-desk-label     700 11/16   labels, uppercase with --paper-track-label
#   --paper-desk-hero / --paper-desk-num   the hero tile and its figures
#   --paper-control-h      36px        buttons, fields, the segmented control
# Corners: chip 10 = radius-sm, field 14 = radius-md, card 20 = radius-lg, tile 24 = radius-xl,
# sheet 28 = --paper-radius-sheet.
#
# Project hues (no Visor role): 12 OKLCH angles, 24 degrees apart, none in the coral range.
# Each ships as --paper-hue-<angle>-fill / -fill-strong / -ink / -solid, per mode.
# 75 sand · 99 gold · 123 olive · 147 green · 171 jade · 195 teal · 219 cyan · 243 tide
# 267 blue · 291 violet · 315 orchid · 339 rose
#
# No success, warning or info colour: those roles draw in Paper's neutral ink. Coral is for
# alerts only (the error roles). Every text pair a Visor component draws clears AA 4.5:1 in
# both modes (VI-746); text-disabled is exempt (WCAG 1.4.3). The pairs are pinned by
# packages/theme-engine/src/__tests__/paper-theme.test.ts.
name: paper
label: Paper
group: Low Orbit
color-scheme: adaptive
version: 1

colors:
  primary: "#1a5f7a"
  neutral: "#1e1f21"
  background: "#fcfcfb"
  surface: "#f7f6f2"
  error: "#f28b6d"

colors-dark:
  primary: "#1a5f7a"
  neutral: "#1e1f21"
  background: "#0c1015"
  surface: "#151b20"
  error: "#f28b6d"

typography:
  display:
    family: "Satoshi"
    weight: 900
    weights: [300, 400, 500, 700, 900]
    source: fontshare
  heading:
    family: "Satoshi"
    weight: 900
    weights: [300, 400, 500, 700, 900]
    source: fontshare
  body:
    family: "Satoshi"
    weight: 500
    weights: [300, 400, 500, 700, 900]
    source: fontshare
  mono:
    family: "ui-monospace, \"SF Mono\", Menlo, monospace"
  # VI-754: the desk type floor. Nothing under 13px for body and meta, so --font-size-xs is 13px.
  # The 11px uppercase label (text xs, --paper-desk-label) is a label role, not body or meta.
  floor: 13

radius:
  sm: 10
  md: 14
  lg: 20
  xl: 24
  pill: 999

components:
  button:
    md-height: "36px"
    radius: "999px"
  input:
    md-height: "36px"
    md-radius: "14px"
  textarea:
    radius: "14px"
  select:
    height: "36px"
    radius: "14px"
  text:
    xs-font-size: "11px"
    xs-text-transform: "uppercase"
    xs-letter-spacing: "0.08em"
    sm-font-size: "13px"
    md-font-size: "14px"
  page-header:
    title-font-size: "34px"
  segmented-control:
    radius: "14px"
    track-bg:
      light: "rgba(30, 31, 33, 0.07)"
      dark: "rgba(245, 245, 240, 0.09)"
    indicator-bg:
      light: "#f7f6f2"
      dark: "#3d4245"
    # VI-746: the default indicator text is the primary button's ink (1.05:1 on the pill).
    indicator-text:
      light: "#1e1f21"
      dark: "#f5f5f0"
    inactive-text:
      light: "#55575b"
      dark: "#b1b8bf"
  switch:
    track-bg:
      light: "rgba(30, 31, 33, 0.14)"
      dark: "rgba(245, 245, 240, 0.2)"
    knob-bg: "#f5f5f0"
    knob-bg-checked: "#f5f5f0"
  # VI-769: the layer chart (LO-343). Investment draws in Tide, the studio's colour, never a
  # client hue; unresolved blocks are coral mixed into the page (40% light, 30% at night).
  layer-chart:
    investment-fill:
      light: "#d8e8f0"
      dark: "#142631"
    investment-fill-strong:
      light: "#b6d2e0"
      dark: "#1d3a4a"
    investment-ink:
      light: "#0d3b4f"
      dark: "#b6d2e0"
    investment-solid:
      light: "#1a5f7a"
      dark: "#5aabbf"
    alert-fill:
      light: "#f8cfc2"
      dark: "#51352f"
  # Paper separates surfaces by tone, never by lines; the topbar sits on the page.
  admin-shell:
    sidebar-border: none
    sidebar-header-border: none
    sidebar-footer-border: none
    topbar-bg: "var(--surface-page)"
    topbar-border: none
    # The sidebar folds to its 68px rail on Paper's 480ms ease (VI-770).
    rail-duration: 480ms
    rail-easing: "cubic-bezier(0.2, 0.8, 0.2, 1)"

overrides:
  light:
    text-primary: "#1e1f21"
    text-secondary: "#55575b"
    # VI-746: Paper's text-3 (#6e6f72) and 62% sub line clear AA on the card only. Visor
    # draws them on wells and selected rows too, so tertiary takes text-2 (as it does at
    # night) and muted takes the lowest opacity that clears every surface.
    text-tertiary: "#55575b"
    text-muted: "rgba(30, 31, 33, 0.7)"
    text-disabled: "#7e7f7a"
    text-link: "#1a5f7a"
    # Paper's alert-text-strong: alert-ink (#ae411f) is 4.37:1 on pressed and raised surfaces.
    text-error: "#963212"
    text-success: "#55575b"
    text-warning: "#55575b"
    text-info: "#55575b"
    text-inverse: "#fcfcfb"
    text-inverse-secondary: "rgba(252, 252, 251, 0.85)"
    surface-popover: "#fcfcfb"
    surface-muted: "#f7f6f2"
    surface-interactive-default: "#edede7"
    surface-selected: "#d8e4e7"
    surface-accent-subtle: "#d8e4e7"
    surface-error-subtle: "#f7e0d4"
    surface-error-soft: "#f7e0d4"
    surface-error-default: "#ae411f"
    surface-success-subtle: "#edede7"
    surface-success-soft: "#edede7"
    surface-success-default: "#55575b"
    surface-warning-subtle: "#edede7"
    surface-warning-soft: "#edede7"
    surface-warning-default: "#55575b"
    surface-info-subtle: "#edede7"
    surface-info-default: "#55575b"
    border-default: "rgba(30, 31, 33, 0.11)"
    border-muted: "rgba(30, 31, 33, 0.07)"
    border-focus: "#1a5f7a"
    border-error: "rgba(242, 139, 109, 0.7)"
    hairline: "rgba(30, 31, 33, 0.11)"
    interactive-primary-bg: "#1a5f7a"
    interactive-primary-text: "#fcfcfb"
    interactive-destructive-bg: "#ae411f"
    interactive-destructive-bg-hover: "#963212"
    interactive-destructive-text: "#fcfcfb"
    overlay-bg: "rgba(12, 16, 21, 0.42)"
    # VI-754: the field family. A fill and no edge; focus and invalid still draw their ring.
    # Declared here so a root theme's field tokens (Studio: Strata on <html>) cannot inherit in.
    input-bg: "rgba(30, 31, 33, 0.06)"
    textarea-bg: "rgba(30, 31, 33, 0.06)"
    select-bg: "rgba(30, 31, 33, 0.06)"
    number-input-bg: "rgba(30, 31, 33, 0.06)"
    tag-input-bg: "rgba(30, 31, 33, 0.06)"
    combobox-bg: "rgba(30, 31, 33, 0.06)"
    otp-bg: "rgba(30, 31, 33, 0.06)"
    input-border: "transparent"
    textarea-border: "transparent"
    select-border: "transparent"
    number-input-border: "transparent"
    tag-input-border: "transparent"
    combobox-border: "transparent"
    otp-border: "transparent"
    paper-desk-title: "900 34px/38px var(--font-heading)"
    paper-desk-title-2: "900 22px/27px var(--font-heading)"
    paper-desk-row: "600 15px/20px var(--font-body)"
