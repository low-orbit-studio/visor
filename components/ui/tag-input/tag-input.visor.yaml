name: TagInput
description: A multi-value tag input with removable chips, keyboard support, and max tag limit.
extends: HTMLDivElement
category: form

when_to_use:
  - Multi-value inputs (tags, categories, labels)
  - Email recipient fields
  - Keyword or skill entry

when_not_to_use:
  - Single value selection (use Select or Combobox)
  - Predefined option sets only (use Combobox with multi-select)

why: >
  TagInput provides a familiar multi-value entry pattern where each value
  is visualized as a removable chip. Enter/comma creates tags, backspace
  removes the last one, and duplicates are prevented.

props:
  - name: value
    type: "string[]"
    description: Controlled array of tag strings.
  - name: defaultValue
    type: "string[]"
    description: Default tags for uncontrolled usage.
  - name: onChange
    type: "(tags: string[]) => void"
    description: Callback when the tag list changes.
  - name: placeholder
    type: string
    default: "'Add tag...'"
    description: Placeholder text when no tags are entered.
  - name: max
    type: number
    description: Maximum number of tags allowed.
  - name: disabled
    type: boolean
    default: "false"
    description: Disables the tag input.
  - name: entryAs
    type: "'text' | 'slot'"
    default: '"text"'
    description: Where the next tag is typed. text types after the last tag as bare text; slot types into a dashed slot the shape of a held tag, drawn on the shared drop edge so edges off turns it off.

theme_hooks:
  - name: --tag-input-min-height / --tag-input-padding / --tag-input-radius
    description: The field around the tags.
  - name: --tag-input-tag-height / --tag-input-tag-padding-x / --tag-input-tag-font-size / --tag-input-tag-font-weight / --tag-input-tag-radius
    description: Each held tag. Unset, the tag is a pill as tall as its line.
  - name: --tag-input-slot-height / --tag-input-slot-padding-x / --tag-input-slot-radius / --tag-input-slot-min-width
    description: The typing slot (entryAs="slot"). Each follows the matching tag key unless set.
  - name: --control-drop-edge-width / --control-drop-edge-style
    description: The typing slot's dashed edge, shared with FileUpload and EmptyState.

dependencies:
  - "@phosphor-icons/react"

preview_url: "https://visor.loworbit.studio/docs/components/form/tag-input"

example: |
  <TagInput placeholder="Add skills..." max={5} onChange={(tags) => console.log(tags)} />
