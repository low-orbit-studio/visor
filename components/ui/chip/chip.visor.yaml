name: Chip
description: Selectable chip primitive for suggestion, tag, and filter patterns with selected/unselected states and size variants. Maps to React ToggleGroup.
extends: HTMLDivElement
category: form

when_to_use:
  - Displaying filterable tag or category options the user can toggle on/off
  - Suggestion rows (search autocomplete, style recommendations)
  - Multi-select filter bars where individual options are toggled independently
  - Any UI pattern that maps to a "toggle group" of labelled options

when_not_to_use:
  - Single binary toggle (use Switch or Checkbox)
  - Navigation tabs or route selectors (use TabBar)
  - Dismissible labels that can be removed from a list (use a deletable tag/badge)
  - Triggering an action rather than selecting a state (use Button)

why: >
  Chip provides three specialized primitives that map to Flutter Material's Chip family:
  Chip (display), ChoiceChip (radio-style), and FilterChip (toggle-style). All three
  share consistent sizing, token-driven theming, and the chip shape — enabling chip
  reuse across filter bars, settings density pickers, event category selectors, and
  deletable tag inputs.

variants:
  variant: [default, outlined]
  size: [sm, md, lg]

props:
  - name: variant
    type: '"default" | "outlined"'
    default: '"default"'
  - name: size
    type: '"sm" | "md" | "lg"'
    default: '"md"'
  - name: avatar
    type: React.ReactNode
    optional: true
  - name: leadingIcon
    type: React.ReactNode
    optional: true
  - name: label
    type: React.ReactNode
    optional: true
  - name: onDeleted
    type: "() => void"
    optional: true
  - name: deleteIcon
    type: React.ReactNode
    optional: true
  - name: deleteLabel
    type: string
    default: '"Remove"'

sub_components:
  - name: ChoiceChip
    element: button
    description: Radio-style single-select chip. Renders with role="radio" and aria-checked. Use inside a ChipGroup with type="single".
    props:
      - name: selected
        type: boolean
        default: "false"
      - name: onPressed
        type: "() => void"
        optional: true
      - name: value
        type: string
        optional: true

  - name: FilterChip
    element: button
    description: Toggle-style multi-select chip. Renders with role="checkbox" and aria-checked. Use inside a ChipGroup with type="multiple". Supports an optional count pill for quick-filter pivots (e.g. "Active 47").
    props:
      - name: selected
        type: boolean
        default: "false"
      - name: onPressed
        type: "() => void"
        optional: true
      - name: value
        type: string
        optional: true
      - name: count
        type: React.ReactNode
        optional: true
        description: Count pill rendered after the label. Accepts strings, numbers, or elements. Part of the accessible button name.
      - name: countTone
        type: '"primary" | "neutral"'
        default: '"neutral"'
        description: Tone for the count pill. "neutral" uses muted surface; "primary" uses accent surface. Auto re-tones on selected state.
      - name: selectedTreatment
        type: '"accent" | "neutral"'
        default: '"accent"'
        description: >
          Selected-state visual treatment. "accent" (default) uses accent-tinted bg + accent border + link text.
          "neutral" uses --surface-card bg + neutral border + primary text; the count pill renders as a solid mint
          pill (--surface-success-default) when selected. Use in editorial/admin contexts where accent bleed is undesirable.
      - name: trailingIcon
        type: React.ReactNode
        optional: true
        description: >
          Muted trailing icon (e.g. a caret) rendered after the label/count for "filter-as-dropdown" chips.
          Orthogonal to count/selectedTreatment. Hidden from assistive tech (aria-hidden). Default render is
          unchanged when omitted.

dependencies:
  - "class-variance-authority"
  - "@phosphor-icons/react"

preview_url: "https://visor.design/docs/components/data-display/chip"

example: |
  <Chip label="React" />
  <Chip label="Featured" onDeleted={() => removeTag("featured")} />
  <ChoiceChip label="Compact" selected={density === "compact"} onPressed={() => setDensity("compact")} />
  <FilterChip label="Events" selected={filters.includes("events")} onPressed={() => toggleFilter("events")} />
  <FilterChip label="All" count={132} onPressed={() => setFilter("all")} />
  <FilterChip label="Active" count={47} countTone="primary" selected onPressed={() => setFilter("active")} />
  <FilterChip label="Suspended" count={8} onPressed={() => setFilter("suspended")} />
