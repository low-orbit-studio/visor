name: Field
description: A form field wrapper composing label, description, and error components.
extends: HTMLDivElement
category: form

when_to_use:
  - Wrapping any form control with a label and optional description
  - Displaying validation errors below a form control
  - Consistent vertical or horizontal field layout in forms

when_not_to_use:
  - Standalone labels without a wrapper (use Label directly)
  - Non-form content grouping (use a <div> or Card)
  - Complex multi-field layouts (compose individual Field components)

why: >
  Field provides consistent spacing and structure for form fields. It
  composes FieldLabel, FieldDescription, and FieldError to handle the
  full lifecycle of a form control — from labeling through validation
  feedback. It supports vertical and horizontal orientations via CVA.

variants:
  orientation: [vertical, horizontal]

props:
  - name: orientation
    type: "'vertical' | 'horizontal'"
    default: "vertical"
    description: Layout direction of the field and its label

sub_components:
  - name: FieldLabel
    description: >
      Styled label for the form control. Wraps the Label component. `optional`
      renders " optional" after the label text, inside the label, so the
      accessible name includes it.
  - name: FieldControl
    description: >
      The box a control sits in (VI-805). Put one Input, Textarea or Select
      inside: the control fills the box and goes bare, and the box draws the
      fill, edge, focus ring (2px on keyboard focus) and invalid look, read from
      the control's aria-invalid. `tall` lets the box grow with a Textarea's
      text. Solid by default; inside data-glass="on" it reads the glass layer's
      control fill, hover fill, ring, ink and blur.
  - name: FieldDescription
    description: Helper text below the label providing additional guidance.
  - name: FieldError
    description: >
      Error message display with role="alert". Accepts an errors array or
      children. Optional `icon` prop renders an aria-hidden leading glyph and
      sits at the top left, centred on the message's first line, so a wrapped
      message runs on below it. A theme sizes it with `field.error-icon-size`
      (its width and height, whatever size the icon was passed at). Without it the error renders
      as plain inline text (default, unchanged). Typography follows the density
      axis: place data-density="editorial" on any ancestor to activate the
      13px/11px discrete ramp and tertiary color treatment. Its colour is the
      theme's `field.error-color` (unset, --text-error); inside
      data-glass="on" it takes the glass layer's on-photo ink.

dependencies:
  - "class-variance-authority"

preview_url: "https://visor.loworbit.studio/docs/components/form/field"

example: |
  <Field>
    <FieldLabel htmlFor="name" optional>Your name</FieldLabel>
    <FieldControl>
      <Input id="name" aria-invalid="true" aria-describedby="name-error" />
    </FieldControl>
    <FieldError id="name-error" icon={<WarningCircle weight="fill" />}>Tell us your name</FieldError>
  </Field>

  <Field>
    <FieldLabel htmlFor="email">Email</FieldLabel>
    <FieldDescription>We will never share your email.</FieldDescription>
    <Input id="email" type="email" />
    <FieldError errors={[{ message: "Email is required" }]} />
  </Field>
