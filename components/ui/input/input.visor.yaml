name: Input
version: minor
changeset: "aria-invalid=\"true\" now renders an inset 1.5px destructive border (box-shadow), tinted background (--surface-error-subtle / color-mix fallback), and a destructive-tinted focus halo when focused. Non-breaking: consumers not passing aria-invalid are unaffected."
description: A text input component with focus and validation states.
extends: HTMLInputElement
category: form

when_to_use:
  - Single-line text entry (name, email, search, URL)
  - Password fields
  - Numeric input with type="number"
  - File uploads with type="file"

when_not_to_use:
  - Multi-line text entry (use Textarea)
  - Selecting from predefined options (use Select or Combobox)
  - Boolean on/off values (use Checkbox or Switch)
  - Rich text editing (use a dedicated rich text editor)

why: >
  Input provides consistent styling, focus rings, validation states, and
  disabled appearance across all text-based form fields. It supports
  aria-invalid for error states and integrates with the Field component
  for labels and error messages.

theme_hooks:
  - name: --field-control-bg
    description: >
      Shared "what surface does a form control sit on" role. Controls the input's
      background-color (and the inner color-mix base of the aria-invalid tint).
      Defaults to var(--input-bg) so default inputs are unchanged; a form context
      can set it to lift controls onto a different surface without a prop.
      Under data-density="editorial", the fallback becomes var(--surface-card)
      while still honoring any scoped --field-control-bg override.
  - name: --input-placeholder-color
    description: >
      Override for the ::placeholder color. Defaults to var(--text-secondary).
  - name: --input-height-md / --input-height-lg
    description: >
      Per-size control height for md and lg. Default to auto. Set to retune
      control height without a prop (zero-regression — unset = unchanged).
      Note: sm height is driven by the density axis (data-density="editorial"
      bakes in 33.5px; canonical default is 2.25rem).
  - name: --input-radius-md / --input-radius-lg
    description: >
      Per-size border-radius for md and lg. Default to var(--radius-sm, 0.5rem).
      Note: sm border-radius is driven by the density axis (data-density="editorial"
      bakes in var(--radius-md); canonical default is var(--radius-sm, 0.25rem)).
  - name: --input-padding-sm / --input-padding-md / --input-padding-lg
    description: >
      Per-size padding (the full shorthand). Default to each size's current
      spacing-token shorthand. Set to a full "vertical horizontal" value to
      retune control padding per context.

density_axis:
  - axis: data-density="editorial"
    description: >
      Set data-density="editorial" on any ancestor to switch Input to the
      editorial density: sm inputs render at 33.5px height with --radius-md
      corners, and the default background shifts to var(--surface-card)
      (scoped --field-control-bg overrides are still honored). Canonical
      defaults are unchanged when no data-density is present.

props:
  - name: size
    type: "'sm' | 'md' | 'lg'"
    default: "md"
    description: Controls height, padding, font-size, and border-radius
  - name: type
    type: string
    default: "text"
    description: HTML input type (text, email, password, number, file, etc.)
  - name: leadingIcon
    type: React.ReactNode
    description: Optional leading glyph rendered inside the field (e.g. a Phosphor icon). The input reserves enough left padding to clear it.
  - name: passwordManagers
    type: "'ignore' | 'allow'"
    default: "ignore"
    description: >
      Controls password-manager autofill behavior. Defaults to "ignore" so contact, marketing, and settings forms don't render 1Password/Bitwarden/LastPass autofill icons. Set to "allow" on login and credential fields. When "ignore", emits data-1p-ignore, data-bwignore, data-lpignore, and data-form-type="other" — the four per-manager opt-out attributes browsers honor where autocomplete="off" is ignored.

dependencies: []

preview_url: "https://visor.loworbit.studio/docs/components/form/input"

example: |
  <Input type="email" placeholder="you@example.com" />

  <Input type="password" passwordManagers="allow" aria-invalid="true" />
