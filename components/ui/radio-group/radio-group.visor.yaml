name: Radio Group
description: An accessible radio group component built on Radix UI RadioGroup.
extends: HTMLDivElement
category: form

when_to_use:
  - Selecting exactly one option from a small set (2-6 choices)
  - Mutually exclusive choices where all options should be visible
  - Form fields like gender, plan selection, or priority level
  - variant="card" when each option needs an icon and a sentence (visibility levels, plan tiers), including options shown disabled

when_not_to_use:
  - Multiple selections allowed (use Checkbox group)
  - Long option lists with 7+ items (use Select or Combobox)
  - Binary on/off toggle (use Switch or Checkbox)

why: >
  RadioGroup wraps Radix UI RadioGroup to provide correct keyboard
  navigation (arrow keys cycle options), focus management, and ARIA
  radio group semantics. It follows the same visual pattern as Checkbox
  for consistency. Pair each RadioGroupItem with a Label for accessibility.

sub_components:
  - name: RadioGroupItem
    description: An individual radio button with a filled circle indicator when selected. In the card variant it is a card with icon, title and description slots and a check mark.

props:
  - name: variant
    type: "'default' | 'card'"
    default: "default"
    description: "default draws a dot beside a label; card draws each item as a card with icon, title and description."
  - name: indicator
    type: "'check' | 'dot'"
    default: "check"
    description: "Card variant only. check draws a check in a filled disc on the chosen card; dot draws a ring on every card and a dot inside the chosen one. Colours: --radio-card-ring, --radio-card-ring-selected, --radio-card-dot."
  - name: value
    type: string
    description: Controlled selected value
  - name: defaultValue
    type: string
  - name: onValueChange
    type: "(value: string) => void"
  - name: disabled
    type: boolean
    default: false
  - name: orientation
    type: "'vertical' | 'horizontal'"
    default: "vertical"

item_props:
  - name: icon
    type: ReactNode
    description: Card variant only. Leading icon or swatch; decorative (aria-hidden).
  - name: title
    type: ReactNode
    description: Card variant only. The option's name; it is the item's accessible name.
  - name: description
    type: ReactNode
    description: Card variant only. One line saying what the option means; it describes the item.
  - name: disabled
    type: boolean
    description: The item stays in place and readable, is skipped by the arrow keys, and cannot be chosen. Pass aria-describedby (an id) to say why; it is announced after the description.

dependencies:
  - "@radix-ui/react-radio-group"
  - "@phosphor-icons/react"

preview_url: "https://visor.loworbit.studio/docs/components/form/radio-group"

example: |
  <RadioGroup defaultValue="medium">
    <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
      <RadioGroupItem value="small" id="small" />
      <Label htmlFor="small">Small</Label>
    </div>
    <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
      <RadioGroupItem value="medium" id="medium" />
      <Label htmlFor="medium">Medium</Label>
    </div>
    <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
      <RadioGroupItem value="large" id="large" />
      <Label htmlFor="large">Large</Label>
    </div>
  </RadioGroup>

example_card: |
  <RadioGroup variant="card" defaultValue="team" aria-label="Visibility">
    <RadioGroupItem value="you" icon={<UserIcon />} title="Just You" description="Only you can see it." />
    <RadioGroupItem value="team" icon={<UsersIcon />} title="Your Team" description="Your team can see it." />
    <RadioGroupItem
      value="public"
      icon={<GlobeIcon />}
      title="Public"
      description="Anyone can see it."
      disabled
      aria-describedby="why-public"
    />
    <p id="why-public">Public needs a verified booking.</p>
  </RadioGroup>

theme_hooks:
  - name: --radio-card-bg
    description: >
      Card surface. Theme key: components.radio-card.bg.
  - name: --radio-card-border
    description: >
      Resting card edge colour. Theme key: components.radio-card.border.
  - name: --radio-card-radius
    description: >
      Card corner radius. Theme key: components.radio-card.radius.
  - name: --radio-card-hover-bg
    description: >
      Card surface on hover. Theme key: components.radio-card.hover-bg.
  - name: --radio-card-selected-bg
    description: >
      Chosen card surface. Theme key: components.radio-card.selected-bg.
  - name: --radio-card-selected-border
    description: >
      Chosen card edge colour. Theme key: components.radio-card.selected-border.
  - name: --radio-card-icon-size
    description: >
      Leading icon box and font size. Theme key: components.radio-card.icon-size.
  - name: --radio-card-mark-bg
    description: >
      Filled disc behind the check mark. Theme key: components.radio-card.mark-bg.
  - name: --radio-card-mark-text
    description: >
      Check mark colour. Theme key: components.radio-card.mark-text.
  - name: --radio-card-ring
    description: >
      indicator="dot" ring on an unchosen card. Theme key: components.radio-card.ring.
  - name: --radio-card-ring-selected
    description: >
      indicator="dot" ring on the chosen card. Falls back to the dot colour.
      Theme key: components.radio-card.ring-selected.
  - name: --radio-card-dot
    description: >
      indicator="dot" dot colour. Falls back to var(--interactive-primary-bg, var(--primary, #111827)).
      Theme key: components.radio-card.dot.
