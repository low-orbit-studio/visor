name: Text
description: A body text component with size, weight, family (body or mono), color (including success and amber inks), and line-height variants.
extends: HTMLElement
category: typography

when_to_use:
  - Body paragraphs and descriptive text
  - Captions, helper text, or secondary descriptions
  - Any text content that needs consistent typographic styling
  - Inline text elements (span, label) with variant control

when_not_to_use:
  - Page or section headings (use Heading)
  - Form field labels (use Label or Field)
  - Code snippets (use CodeBlock or inline <code>); a mono figure such as a fee or a count is family="mono"

why: >
  Text provides a polymorphic body text primitive with CVA variants for size,
  weight, color, and line-height. It renders as p by default but supports span,
  div, and label via the as prop. All typography values reference design tokens,
  ensuring consistency across themes.

variants:
  size: [xs, sm, md, lg, xl]
  weight: [normal, medium, semibold, bold]
  family: [mono]  # `body`, the default, is .base itself and has no class
  color: [primary, secondary, tertiary, warning, success, amber, inherit]
  leading: [tight, snug, normal, relaxed, loose]

props:
  - name: as
    type: "'p' | 'span' | 'div' | 'label'"
    default: "'p'"
    description: HTML element to render
  - name: size
    type: "'xs' | 'sm' | 'md' | 'lg' | 'xl'"
    default: "'md'"
  - name: weight
    type: "'normal' | 'medium' | 'semibold' | 'bold'"
    default: "'normal'"
  - name: family
    type: "'body' | 'mono'"
    default: "'body'"
    description: Type face. `mono` reads `--font-mono` (fallback `ui-monospace, monospace`) and composes with every size and weight.
  - name: color
    type: "'primary' | 'secondary' | 'tertiary' | 'warning' | 'success' | 'amber' | 'inherit'"
    default: "'primary'"
    description: Ink. `success` reads `--text-success`; `amber` reads `--text-amber`, falling back to `--text-warning`.
  - name: leading
    type: "'tight' | 'snug' | 'normal' | 'relaxed' | 'loose'"
    default: "'normal'"

dependencies:
  - "class-variance-authority"

preview_url: "https://visor.loworbit.studio/docs/components/typography/text"

example: |
  <Text>Default body text paragraph.</Text>

  <Text size="sm" color="secondary">
    Helper text or caption.
  </Text>

  <Text as="span" weight="semibold" size="lg">
    Inline emphasized text
  </Text>

  <Text as="span" family="mono" weight="bold" color="success">
    $400
  </Text>
