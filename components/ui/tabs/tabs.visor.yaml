name: Tabs
version: 1.2.0
description: A tabs component for switching between content panels with default, line and keyed style variants.
extends: HTMLDivElement
category: navigation

when_to_use:
  - Switching between related content panels on the same page
  - Organizing settings, profiles, or dashboards into logical sections
  - Replacing page navigation when content is closely related and lightweight
  - Any UI where only one content section should be visible at a time

when_not_to_use:
  - Sequential step-by-step flows (use a stepper or wizard)
  - Expanding/collapsing multiple content sections simultaneously (use Accordion)
  - Global page-level navigation (use Navbar or Sidebar)
  - Filtering or sorting data (use ToggleGroup or Select)

why: >
  Tabs wraps Radix UI Tabs for full keyboard navigation and ARIA tab semantics.
  Three list variants — default (pill-style background), line (bottom border) and
  keyed (a wrapping row with one key-coloured highlight that slides to the active
  tab in x and y) — cover the most common tab patterns. Active state styling and focus rings are
  handled automatically.

variants:
  variant: [default, line, keyed]
  size: [default, compact]

theme_hooks:
  - name: --tabs-list-radius
    description: >
      Default-variant rail corners. The triggers derive their radius from it
      (rail radius minus rail padding minus the 1px trigger inset), so the
      corners stay concentric (VI-837): a pill rail holds pill triggers.
      Theme key: components.tabs.list-radius.
  - name: --tabs-trigger-radius
    description: >
      Trigger corners. Leave unset: derived from the rail (line variant:
      var(--radius-md, 0.375rem)). Bound, it is an explicit override. Theme
      key: components.tabs.trigger-radius.

  - name: --tabs-keyed-key
    description: >
      Keyed variant key colour: the highlight's 1px edge and the active tab's
      icon. Default var(--surface-accent-default). Theme key: components.tabs.keyed-key.
  - name: --tabs-keyed-fill
    description: >
      Keyed variant highlight fill. Default: the key colour at 10%. Theme key:
      components.tabs.keyed-fill.
  - name: --tabs-keyed-ink
    description: >
      Keyed variant label ink (full when active, 80% on hover, 55% at rest).
      Default var(--text-primary). Theme key: components.tabs.keyed-ink.
  - name: --tabs-keyed-radius
    description: >
      Keyed variant tab and highlight corners. Default var(--radius-md). Theme
      key: components.tabs.keyed-radius.

props:
  - name: variant
    type: '"default" | "line" | "keyed"'
    default: '"default"'
    description: "Controls TabsList visual style"
  - name: size
    type: '"default" | "compact"'
    default: '"default"'
    description: "Keyed variant only: compact narrows the tab side padding from 12px to 10px"
  - name: defaultValue
    type: "string"
    description: "Initially active tab value (uncontrolled)"
  - name: value
    type: "string"
    description: "Active tab value (controlled)"
  - name: onValueChange
    type: "(value: string) => void"
    description: "Callback when active tab changes"

sub_components:
  - name: TabsList
    description: >
      Horizontal container for tab triggers with variant styling. The keyed
      variant renders its highlight as data-slot="tabs-keyed-indicator" and sets
      data-size.
  - name: TabsTrigger
    description: Clickable tab button tied to a content panel via matching value prop.
    props:
      - name: count
        type: "React.ReactNode"
        description: "Optional inline count pill rendered after the label. Accepts strings, numbers, or elements. Omit to render the trigger without a pill."
      - name: countTone
        type: '"primary" | "neutral"'
        default: '"neutral"'
        description: "Visual tone of the count pill when inactive. Active state (data-state=\"active\") re-tones the pill automatically regardless of this prop."
  - name: TabsContent
    description: Content panel that displays when its matching tab trigger is active.

dependencies:
  - "@radix-ui/react-tabs"
  - "class-variance-authority"

preview_url: "https://visor.loworbit.studio/docs/components/navigation/tabs"

example: |
  <Tabs defaultValue="members">
    <TabsList variant="default">
      <TabsTrigger value="members" count={12}>Members</TabsTrigger>
      <TabsTrigger value="pending" count={3}>Pending</TabsTrigger>
      <TabsTrigger value="roles" count={4}>Roles</TabsTrigger>
    </TabsList>
    <TabsContent value="members">Members content here.</TabsContent>
    <TabsContent value="pending">Pending content here.</TabsContent>
    <TabsContent value="roles">Roles content here.</TabsContent>
  </Tabs>
