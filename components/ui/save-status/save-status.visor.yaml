name: SaveStatus
description: Autosave readout — Saved / Saving / Syncing / Unsaved / Couldn't save in a fixed-width slot that never reflows its row, with a retry mark after a failed save. aria-live polite; draws no edge.
extends: HTMLSpanElement
category: feedback

when_to_use:
  - Showing where an autosaved value stands, beside the section or field it saves
  - Any editor with no Save button, driven by the useAutosave hook
  - Offering a retry after a save failed, without a toast

when_not_to_use:
  - Confirming a one-off action the user just took — use SuccessFeedback or a toast
  - A save/cancel footer model — use the admin editor patterns' footer buttons
  - Conflicts between tabs or users — use ConflictBanner

why: >
  The Blacklight editor autosaves on a 600ms debounce with no Save button, and needs a
  readout that says where each section stands without moving the row it sits in. SaveStatus
  is that readout: five fixed labels in a slot whose width is a token, so the row never
  reflows as the state changes, announced politely to assistive tech. It is status text,
  not a control — the only control is the retry mark after a failed save, which is the
  editor's icon mark (the icon Button's size, pad and ink). It draws no edge, so there is
  nothing for the edge switch to turn off.

variants:
  status:
    saved: Saved — muted, the resting state.
    saving: Saving — a write is in flight.
    syncing: Syncing — a first sync from an outside source is writing rows the user did not type. The consumer sets it; useAutosave never emits it.
    unsaved: Unsaved — a change is waiting for the debounce. Draw it as a dot alone with unsavedAs="dot"; the label stays as the dot's accessible name.
    refused: Couldn't save — validation refused the value or the write failed; shows a retry mark when onRetry is passed.

theme_hooks:
  - name: --save-status-width
    description: Slot width. Unset, the slot is sized from content (the longest label in the current font plus the retry mark), the same in every state. Set, it wins and a longer label truncates.
  - name: --save-status-syncing-color
    description: Ink of the Syncing state. Unbound it reads --text-secondary.
  - name: --save-status-font-size
    description: Readout type size (--font-size-xs).
  - name: --save-status-dot-size
    description: Diameter of the status dot (dot), and of the Unsaved dot until --save-status-unsaved-dot-size is set (0.5rem). The slot width does not change.
  - name: --save-status-unsaved-dot-size
    description: Diameter of the dot that draws Unsaved, in both the status dot and unsavedAs="dot". Follows --save-status-dot-size.
  - name: --save-status-font-family / --save-status-text-transform / --save-status-letter-spacing
    description: Readout family, case and tracking. Unset, the readout inherits from its row and any rule of yours wins.
  - name: --button-icon-size / --button-icon-pad / --button-icon-ghost-color
    description: The retry mark, shared with the icon-only Button.

props:
  - name: status
    type: "'saved' | 'saving' | 'syncing' | 'unsaved' | 'refused'"
    description: Where the value stands — pass useAutosave(...).status.
  - name: onRetry
    type: "() => void"
    description: Shows a retry mark while status is refused. Pass useAutosave(...).retry.
  - name: labels
    type: "Partial<Record<'saved' | 'saving' | 'syncing' | 'unsaved' | 'refused', string>>"
    description: Override any of the five labels, e.g. to translate them.
  - name: unsavedAs
    type: "'text' | 'dot'"
    default: '"text"'
    description: How unsaved is drawn. dot draws a dot alone, keeping the label as visually hidden text so it is still announced.
  - name: dot
    type: boolean
    default: "false"
    description: Draws a status dot before the label in every state, in the state's ink. Its box is as wide as the larger of the two dot sizes, so the label never moves.
  - name: retryLabel
    type: string
    default: '"Retry saving"'
    description: Accessible name of the retry mark.

dependencies:
  - "@phosphor-icons/react"
  - "@loworbitstudio/visor-core"

preview_url: "https://visor.design/docs/components/feedback/save-status"

example: |
  const autosave = useAutosave(bio, saveBio)

  <SaveStatus status={autosave.status} onRetry={autosave.retry} />
