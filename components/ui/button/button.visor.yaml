name: Button
description: Primary interactive element for triggering actions.
extends: HTMLButtonElement
category: form

when_to_use:
  - Triggering an action (submit, save, delete, confirm)
  - Primary and secondary CTAs on a page
  - Form submission
  - Destructive actions requiring visual emphasis

when_not_to_use:
  - Navigation to another page (use a link or NextJS Link)
  - Toggling state on/off (use Switch or Toggle Group)
  - Selecting from options (use Select or Radio Group)

why: >
  Button is the most common interactive primitive. It handles focus management,
  keyboard interaction, and disabled states correctly out of the box.
  Using it instead of a styled <div> or <a> ensures accessibility compliance.

variants:
  variant: [default, secondary, outline, ghost, destructive]
  size: [sm, md, lg, dlg]

props:
  - name: variant
    type: "'default' | 'secondary' | 'outline' | 'ghost' | 'destructive'"
    default: "default"
  - name: size
    type: "'sm' | 'md' | 'lg' | 'dlg'"
    default: "md"
    description: >
      Standard sizes plus `dlg` — the compact dialog-footer button (dlg-btn) from
      the Animal dialog substrate (VI-620): 11px/600 text, tokenized ~8/12px
      padding, radius-lg. Its three intents reuse the variant axis — primary via
      variant="default", ghost via variant="ghost" (renders a hairline-outlined,
      secondary-ink face at dlg size), danger via variant="destructive" (renders
      a subtle-danger face at dlg size).
  - name: asChild
    type: boolean
    default: false
    description: Merge props onto child element instead of rendering a <button>
  - name: disabled
    type: boolean
    default: false
  - name: gated
    type: boolean
    default: false
    description: >
      Renders the button in an inert permission-gated state — visually dimmed,
      cursor not-allowed, and click handlers suppressed. Uses aria-disabled
      instead of native disabled so the button stays keyboard-focusable
      (required for the tooltip to be reachable by keyboard and screen-reader
      users). Works orthogonally with all variants and sizes.
  - name: gatedReason
    type: string
    default: undefined
    description: >
      Explanation surfaced in an anchored Radix tooltip when the button is
      gated. Only rendered when gated is also true. A TooltipProvider ancestor
      is required whenever gatedReason is set — add one at the page or layout
      level. Example: "You can't delete this — you're not an owner".
  - name: pending
    type: boolean
    default: false
    description: >
      Reports that the button's action is in flight — a busy glyph paints over
      the label, aria-busy is set, and activation is suppressed so the action
      cannot be double-submitted. The control's geometry is held: the idle
      children stay in the box at zero opacity and the glyph overlays them, so
      the button never resizes and never shoves its siblings. Like gated, it
      does NOT set the native disabled attribute, so the button stays focusable
      while the user waits. Under asChild the state attributes and the
      activation suppression still apply, but no chrome is injected (Slot takes
      a single child).
  - name: pendingLabel
    type: ReactNode
    default: undefined
    description: >
      Optional text shown beside the busy glyph while pending. Decorative only —
      it is aria-hidden, and the accessible name stays the idle label so the
      control is not renamed mid-action. Pair pending with your own
      role="status" region when the message needs to be spoken; Button
      deliberately does not invent one.
  - name: pendingDelay
    type: number
    default: 200
    description: >
      Milliseconds to wait before painting the busy glyph, so an action that
      resolves faster than this shows nothing at all. Overrides the themed
      --button-pending-delay.
  - name: pendingMinDuration
    type: number
    default: 300
    description: >
      Milliseconds to keep the busy glyph on screen once painted, so a barely-
      slow action does not strobe. Overrides the themed
      --button-pending-min-duration.

dependencies:
  - "class-variance-authority"
  - "@radix-ui/react-tooltip"

registry_dependencies:
  - "utils"
  - "spinner"

notes: |
  **TooltipProvider requirement:** when using `gatedReason`, a `<TooltipProvider>`
  ancestor must exist in the React tree. The simplest setup is to wrap your app
  root or layout with `<TooltipProvider>`. Without it, the tooltip will silently
  fail to render. Consumers that never set `gatedReason` are not affected.

  **Ghost held/open state (CSS-only, opt-in):** a `ghost`-variant button paints a
  subtle held look (`--surface-subtle` bg, `--text-primary` text) when it carries
  any one of `data-state="open"`, `data-active="true"`, or the `isActive` className.
  No prop/API change — `data-state="open"` is forwarded automatically by Radix when
  the button is a `<Trigger asChild>` (Popover/DropdownMenu); the other two are
  manual opt-ins. Default ghost rendering is unchanged when none are set.

  **Pending state (`pending`):** the busy affordance is gated on two thresholds so
  it reads as progress rather than as a glitch — it does not paint for the first
  `--button-pending-delay` (200ms), and once painted it holds for at least
  `--button-pending-min-duration` (300ms). Both are themeable custom properties
  and both can be overridden per call site via `pendingDelay` / `pendingMinDuration`.
  Neither property is declared on `.base`, so a theme's `:root` value is not
  shadowed (the defect VI-625 fixed on Spinner). The glyph is the `spinner`
  primitive, which already pauses under `prefers-reduced-motion` — a paused ring
  is still a visible affordance, so nothing extra is needed there.

  **Why the geometry is held rather than a leading slot:** a leading spinner slot
  adds its own width plus a gap, so the control grows the moment it gets busy and
  shoves everything after it in a `justify-content: flex-end` footer. Holding the
  idle box and overlaying the glyph is the only arrangement where the pending
  state costs zero layout.

    **Density axis (`data-density="editorial"`):** setting `data-density="editorial"` on
  any ancestor (typically the app root) switches Button to the editorial density:
    - `.sizeMd` renders at `2.125rem` height with `line-height: normal`
    - `.sizeSm` renders with `0.8125rem` font-size
  The canonical defaults (`2.5rem` height, `line-height: 1`, `0.75rem` font-size) are
  always active when no `data-density` attribute is present — zero-regression for
  default consumers.

preview_url: "https://visor.loworbit.studio/docs/components/general/button"

example: |
  <Button variant="default" size="md">Save changes</Button>

  <Button variant="destructive">Delete account</Button>

  <Button variant="ghost" size="sm">Cancel</Button>

  {/* Gated — no reason (tooltip suppressed) */}
  <Button gated>Delete organization</Button>

  {/* Pending — geometry held, activation suppressed, aria-busy set */}
  <Button pending={saving}>Save changes</Button>

  {/* Pending with a decorative busy label */}
  <Button pending={saving} pendingLabel="Saving…">Save changes</Button>

    {/* Gated with reason — tooltip shown on hover/focus */}
  <TooltipProvider>
    <Button gated gatedReason="You can't delete this — you're not an owner">
      Delete organization
    </Button>
  </TooltipProvider>
