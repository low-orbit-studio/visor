name: Button
description: Primary interactive element for triggering actions.
extends: HTMLButtonElement
category: form

when_to_use:
  - Triggering an action (submit, save, delete, confirm)
  - Primary and secondary CTAs on a page
  - Form submission
  - Destructive actions requiring visual emphasis

when_not_to_use:
  - Navigation to another page (use a link or NextJS Link)
  - Toggling state on/off (use Switch or Toggle Group)
  - Selecting from options (use Select or Radio Group)

why: >
  Button is the most common interactive primitive. It handles focus management,
  keyboard interaction, and disabled states correctly out of the box.
  Using it instead of a styled <div> or <a> ensures accessibility compliance.

variants:
  variant: [default, secondary, outline, ghost, destructive]
  size: [sm, md, lg]

props:
  - name: variant
    type: "'default' | 'secondary' | 'outline' | 'ghost' | 'destructive'"
    default: "default"
  - name: size
    type: "'sm' | 'md' | 'lg'"
    default: "md"
  - name: asChild
    type: boolean
    default: false
    description: Merge props onto child element instead of rendering a <button>
  - name: disabled
    type: boolean
    default: false
  - name: gated
    type: boolean
    default: false
    description: >
      Renders the button in an inert permission-gated state — visually dimmed,
      cursor not-allowed, and click handlers suppressed. Uses aria-disabled
      instead of native disabled so the button stays keyboard-focusable
      (required for the tooltip to be reachable by keyboard and screen-reader
      users). Works orthogonally with all variants and sizes.
  - name: gatedReason
    type: string
    default: undefined
    description: >
      Explanation surfaced in an anchored Radix tooltip when the button is
      gated. Only rendered when gated is also true. A TooltipProvider ancestor
      is required whenever gatedReason is set — add one at the page or layout
      level. Example: "You can't delete this — you're not an owner".

dependencies:
  - "class-variance-authority"
  - "@radix-ui/react-tooltip"

notes: |
  **TooltipProvider requirement:** when using `gatedReason`, a `<TooltipProvider>`
  ancestor must exist in the React tree. The simplest setup is to wrap your app
  root or layout with `<TooltipProvider>`. Without it, the tooltip will silently
  fail to render. Consumers that never set `gatedReason` are not affected.

  **Ghost held/open state (CSS-only, opt-in):** a `ghost`-variant button paints a
  subtle held look (`--surface-subtle` bg, `--text-primary` text) when it carries
  any one of `data-state="open"`, `data-active="true"`, or the `isActive` className.
  No prop/API change — `data-state="open"` is forwarded automatically by Radix when
  the button is a `<Trigger asChild>` (Popover/DropdownMenu); the other two are
  manual opt-ins. Default ghost rendering is unchanged when none are set.

  **Density axis (`data-density="editorial"`):** setting `data-density="editorial"` on
  any ancestor (typically the app root) switches Button to the editorial density:
    - `.sizeMd` renders at `2.125rem` height with `line-height: normal`
    - `.sizeSm` renders with `0.8125rem` font-size
  The canonical defaults (`2.5rem` height, `line-height: 1`, `0.75rem` font-size) are
  always active when no `data-density` attribute is present — zero-regression for
  default consumers.

preview_url: "https://visor.loworbit.studio/docs/components/general/button"

example: |
  <Button variant="default" size="md">Save changes</Button>

  <Button variant="destructive">Delete account</Button>

  <Button variant="ghost" size="sm">Cancel</Button>

  {/* Gated — no reason (tooltip suppressed) */}
  <Button gated>Delete organization</Button>

  {/* Gated with reason — tooltip shown on hover/focus */}
  <TooltipProvider>
    <Button gated gatedReason="You can't delete this — you're not an owner">
      Delete organization
    </Button>
  </TooltipProvider>
