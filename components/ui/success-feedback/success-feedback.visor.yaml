name: SuccessFeedback
description: App-wide success/transition feedback pattern. Provides useSuccessToast() hook and SuccessLiveRegion a11y component built on the Toast primitive, and SuccessPanel, the end-of-flow screen (success seal, heading, description, check list, action).
extends: HTMLDivElement
category: feedback

when_to_use:
  - After a CRUD operation completes successfully (create, update, delete, archive)
  - When a file upload or export finishes
  - After settings are saved
  - When an invite is sent or a link is copied
  - Any transient confirmation that a user action succeeded
  - The end of a multi-step flow, where the whole screen confirms it is done (SuccessPanel)

when_not_to_use:
  - Error conditions (use inline validation or error Banner)
  - Warnings that require user attention (use Banner)
  - Persistent messages that must stay visible (use Banner or Alert)
  - Content that requires user acknowledgment (use Dialog)

why: >
  SuccessFeedback wraps the Toast primitive with Borealis-spec defaults:
  4s auto-dismiss (clamped to 3–8s), optional undo action, and an explicit
  a11y live region for screen-reader announcements. The useSuccessToast()
  hook provides a stable imperative API; SuccessLiveRegion augments Sonner's
  built-in aria-live with a dedicated visible-to-AT-only node for edge cases.

sub_components:
  - name: useSuccessToast
    description: Hook returning showSuccess(title, options) that fires a Sonner toast.success() with Borealis-spec defaults.
  - name: SuccessLiveRegion
    description: Visually-hidden role=status aria-live=polite node for screen-reader announcements.
  - name: SuccessPanel
    description: The end-of-flow screen — a 56px round success seal, a heading announced once on mount through SuccessLiveRegion, a description, an optional check list and the host's action, centred. Icons are slots, each defaulting to a check-circle.

props:
  - name: message
    type: "string"
    required: false
    description: "SuccessLiveRegion only — the success text to announce to screen readers. Updates trigger a re-announcement. Defaults to empty string."
  - name: heading
    type: "string"
    required: true
    description: "SuccessPanel only — the heading, announced to screen readers once on mount."
  - name: description
    type: "ReactNode"
    description: "SuccessPanel only — supporting copy under the heading, in the secondary ink."
  - name: icon
    type: "ReactNode"
    description: "SuccessPanel only — the seal's icon slot (30px). Defaults to a check-circle."
  - name: items
    type: "{ icon?: ReactNode; content: ReactNode }[]"
    description: "SuccessPanel only — an optional check list. Each row is an 18px icon (default a success check-circle) and its text; bold runs read in the primary ink."
  - name: action
    type: "ReactNode"
    description: "SuccessPanel only — the host's action, usually a Button."

dependencies:
  - "sonner"
  - "@phosphor-icons/react"

preview_url: "https://visor.design/docs/components/feedback/success-feedback"

example: |
  import { useSuccessToast, SuccessLiveRegion } from "@/components/ui/success-feedback/success-feedback"
  import { Toaster } from "@/components/ui/toast/toast"

  {/* Mount both once in your root layout */}
  <Toaster />
  <SuccessLiveRegion message="" />

  {/* In any component */}
  const { showSuccess } = useSuccessToast()
  showSuccess("Project saved", { description: "All changes have been saved." })

  {/* At the end of a flow */}
  <SuccessPanel
    heading="You're all set"
    description="Your bookings and payments live on your dashboard."
    items={[{ content: <><b>Your info</b> is saved.</> }]}
    action={<Button>Go to Dashboard</Button>}
  />
