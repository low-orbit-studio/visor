name: Stepper
description: A multi-step progress indicator with horizontal and vertical orientations, auto-derived step status, and a locked status for non-interactive steps.
extends: HTMLDivElement
category: navigation

when_to_use:
  - Multi-step forms or wizards showing progress
  - Onboarding flows with sequential steps
  - Checkout or signup processes with distinct stages
  - Any workflow where users need to see their current position and progress
  - A side rail of form sections, beside the form (variant="rail")

when_not_to_use:
  - Simple progress percentage (use Progress)
  - Tab-based content switching without sequential flow (use Tabs)
  - Timelines of past events (use Timeline)
  - Pagination through pages of content (use Pagination)

why: >
  Stepper provides a compound component API for building step indicators with
  automatic status derivation (complete/active/upcoming) based on the activeStep
  prop. The trigger circles show check icons for completed steps, and separators
  visually connect steps with completion-aware coloring. Both horizontal and
  vertical orientations are supported with proper ARIA roles.

props:
  - name: activeStep
    type: number
    default: "0"
    description: Zero-based index of the current active step
  - name: orientation
    type: "'horizontal' | 'vertical'"
    default: "'horizontal'"

variants:
  - name: variant
    values:
      - default
      - prominent
      - rail
    description: >
      Visual treatment for the entire Stepper. "default" is the standard step
      indicator for multi-step forms and linear wizards. "prominent" is designed
      for vertical derivation spines and primary-navigation surfaces: the active
      row gets a primary-soft tint, the active bullet renders a concentric halo
      and filled pulse dot (replacing the step number), and complete-to-next rails
      render in a primary-line tint. Token surface: --interactive-primary-bg
      (border + fill + pulse dot), --interactive-primary-soft (row tint + halo),
      color-mix(in srgb, --interactive-primary-bg 34%, transparent) (rail tint).
      All values are fully theme-agnostic. "rail" is a side list of form
      sections, used vertically: each StepperTrigger is one row-wide button
      holding a dot mark and its label (pass the label as the trigger's
      children), with no circles and no separators. The current row's mark
      stretches to a pill and its trigger carries aria-current="step". The
      states are one ink at 100% (active), 64% (complete), 40% (upcoming) and
      24% (locked): the theme's --text-primary, or under data-glass="on" the
      glass layer's scrim ink (white) with its ink shadow, on the glass scrim. Sizes bind through the stepper component-token
      family (--stepper-rail-*).
  - name: status
    values:
      - complete
      - active
      - upcoming
      - locked
    description: >
      Per-item status override. "complete", "active", and "upcoming" can be
      auto-derived from activeStep; "locked" must always be set explicitly and
      is never auto-derived. A locked item renders a lock glyph in its trigger
      circle and its trigger is non-interactive (aria-disabled, removed from
      tab order).

sub_components:
  - name: Stepper
    description: Root provider managing active step and orientation context.
  - name: StepperItem
    description: Container for a single step with auto-derived status from context. Pass status="locked" to override.
  - name: StepperTrigger
    description: Clickable step indicator circle with status-based styling; check icon for complete, lock glyph for locked. In the rail variant, a row-wide button holding a dot mark and its label (the children).
  - name: StepperTitle
    description: Step label text. Rendered in secondary color when the parent item is locked.
  - name: StepperDescription
    description: Optional secondary description for a step.
  - name: StepperSeparator
    description: Connector line between steps with completion-aware coloring.

dependencies:
  - "@phosphor-icons/react"

preview_url: "https://visor.loworbit.studio/docs/components/navigation/stepper"

example: |
  <Stepper activeStep={1}>
    <StepperItem step={0}>
      <StepperTrigger step={0} />
      <StepperTitle>Account</StepperTitle>
    </StepperItem>
    <StepperSeparator complete />
    <StepperItem step={1}>
      <StepperTrigger step={1} />
      <StepperTitle>Profile</StepperTitle>
    </StepperItem>
    <StepperSeparator />
    <StepperItem step={2}>
      <StepperTrigger step={2} />
      <StepperTitle>Review</StepperTitle>
    </StepperItem>
  </Stepper>

  <Stepper orientation="vertical" variant="rail" activeStep={1} aria-label="Sections">
    <StepperItem step={0}>
      <StepperTrigger step={0} onClick={() => jump(0)}>Welcome</StepperTrigger>
    </StepperItem>
    <StepperItem step={1}>
      <StepperTrigger step={1}>About You</StepperTrigger>
    </StepperItem>
    <StepperItem step={2}>
      <StepperTrigger step={2} onClick={() => jump(2)}>Travel</StepperTrigger>
    </StepperItem>
    <StepperItem step={3} status="locked">
      <StepperTrigger step={3} status="locked">Pay</StepperTrigger>
    </StepperItem>
  </Stepper>
