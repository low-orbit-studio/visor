name: Dialog
description: Modal overlay that requires user attention before returning to the page.
extends: HTMLDivElement
category: overlay

when_to_use:
  - Confirmation prompts (delete, discard, submit)
  - Forms that need focused attention (edit profile, create item)
  - Important information that requires acknowledgment
  - Multi-step wizards in a modal context

when_not_to_use:
  - Side panels for detail views (use Sheet)
  - Non-blocking notifications (use Toast)
  - Simple yes/no without context (use a native confirm or Alert)
  - Menus or navigation (use DropdownMenu or Sheet)

why: >
  Dialog wraps Radix UI Dialog with Visor token styling, providing accessible
  modal behavior including focus trapping, Escape key dismissal, overlay click
  dismissal, and correct aria-labelledby/aria-describedby associations. The
  built-in close button and animated overlay ensure a polished experience
  without any manual wiring.

presentation: >
  presentation="sheet" (or "responsive" below its breakpoint) anchors the same
  content to the bottom edge with top-rounded corners. It is sized with dvh and
  the visual viewport so the on-screen keyboard never covers it, scrolls a
  focused field into view, and appears without the slide under
  prefers-reduced-motion. The close button is always present; swipe is optional.
  No visible border: the resting edge is surface and shadow only.

density_axis: >
  Editorial admin treatment is activated by placing data-density="editorial"
  on any ancestor (typically the app root). Editorial values: surface-card
  background, 480px max-width, radius-xl, spacing-8 padding, shadow-lg,
  font-size-2xl/700 title, text-tertiary description, 2px overlay blur.
  Default (no attribute) rendering is byte-identical to the pre-density
  canonical fallbacks.

props:
  - name: open
    type: boolean
    default: "undefined"
    description: Controlled open state (Dialog root)
  - name: onOpenChange
    type: "(open: boolean) => void"
    default: "undefined"
    description: Called when open state changes (Dialog root)
  - name: modal
    type: boolean
    default: true
    description: When true, interaction with outside elements is blocked (Dialog root)
  - name: presentation
    type: "'dialog' | 'sheet' | 'responsive'"
    default: "dialog"
    description: >
      How the content is presented (Dialog root). dialog is a centred modal,
      sheet is a bottom sheet, responsive is a dialog from breakpoint up and a
      sheet below it. Same content, focus trap and Escape handling in each.
  - name: breakpoint
    type: "number | string"
    default: "640"
    description: Viewport width where responsive switches from sheet to dialog. A number is px; a string is any CSS length (Dialog root)
  - name: container
    type: "HTMLElement | null"
    default: "undefined"
    description: >
      Element the overlay and content portal into, covering only that element
      (Dialog root). Not Radix modal mode: focus is trapped in the content, the
      container's other children are inert, and content outside the container
      stays interactive. Pass the element, not a ref.
  - name: showHandle
    type: boolean
    default: false
    description: Show a drag handle on the sheet presentation; dragging down dismisses (DialogContent)
  - name: back
    type: React.ReactNode
    default: "undefined"
    description: Leading back action rendered before the title, beside the close button (DialogHeader). See DialogBack.
  - name: className
    type: string
    default: "undefined"
    description: Additional CSS class names (DialogContent)
  - name: children
    type: React.ReactNode
    default: "undefined"
    description: Content to render inside the dialog

sub_components:
  - name: Dialog
    description: Root component managing open/close state.
  - name: DialogTrigger
    description: Element that opens the dialog on click.
  - name: DialogContent
    description: The modal panel with overlay, close button, and animations.
  - name: DialogHeader
    description: Container for title and description at the top.
  - name: DialogBack
    description: Leading back action for DialogHeader's back slot (labelled "Back" by default).
  - name: DialogFooter
    description: Right-aligned action row with a hairline top border, for dialog buttons.
  - name: DialogTitle
    description: Accessible dialog heading.
  - name: DialogDescription
    description: Secondary text describing the dialog purpose.
  - name: DialogClose
    description: Explicit close trigger (in addition to the built-in X button).
  - name: DialogOverlay
    description: Background overlay behind the dialog.
  - name: DialogPortal
    description: Portal wrapper for rendering outside the DOM tree.

dependencies:
  - "@radix-ui/react-dialog"
  - "@phosphor-icons/react"

preview_url: "https://visor.loworbit.studio/docs/components/overlay/dialog"

example: |
  <Dialog>
    <DialogTrigger asChild>
      <Button>Edit profile</Button>
    </DialogTrigger>
    <DialogContent>
      <DialogHeader>
        <DialogTitle>Edit profile</DialogTitle>
        <DialogDescription>Make changes to your profile here.</DialogDescription>
      </DialogHeader>
      {/* form content */}
    </DialogContent>
  </Dialog>
