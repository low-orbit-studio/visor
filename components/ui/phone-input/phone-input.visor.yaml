name: PhoneInput
description: An international phone number input with country code selection, format-as-you-type, and E.164 validation.
extends: HTMLInputElement
category: form

when_to_use:
  - Phone number entry fields (domestic or international)
  - Contact forms requiring phone numbers
  - Any form where phone validation is needed

when_not_to_use:
  - General text input (use Input)
  - Phone + extension combined fields (build a composite)

why: >
  PhoneInput wraps the official @intl-tel-input/react v29 component to provide
  country code selection with a searchable dropdown, format-as-you-type with
  per-country formatting rules, and libphonenumber validation. onChange emits
  E.164 or null — never a partial number — so a malformed value cannot be
  persisted. The country dropdown is themed through the library's own CSS
  custom properties, so every Visor theme is correct without consumer CSS.

props:
  - name: id
    type: string
    description: HTML id attribute for the input element.
  - name: name
    type: string
    description: HTML name attribute for the input element.
  - name: value
    type: string | null
    description: Phone number in E.164 (e.g. "+14155551234"). Displayed formatted for the detected country.
  - name: placeholder
    type: string
    description: Placeholder text for the input.
  - name: required
    type: boolean
    default: "false"
    description: Whether the field is required.
  - name: disabled
    type: boolean
    default: "false"
    description: Whether the field is disabled.
  - name: readOnly
    type: boolean
    default: "false"
    description: Whether the field is read-only. Pair with countrySelectorMode="OFF" to also close off the country dropdown.
  - name: countrySelectorMode
    type: '"OFF" | "DROPDOWN" | "FULLSCREEN" | "AUTO"'
    default: '"AUTO"'
    description: Country selector behaviour. "OFF" renders the selected country as a non-interactive element.
  - name: initialCountry
    type: Iso2
    default: '"us"'
    description: ISO 3166-1 alpha-2 country selected on mount.
  - name: size
    type: '"sm" | "md" | "lg"'
    default: '"md"'
    description: Size variant — matches Input component sizes.
  - name: className
    type: string
    description: Additional CSS classes applied to the wrapper.
  - name: portal
    type: "{ container: HTMLElement; scopeClassName: string }"
    description: >
      Portal the country selector out of the input's DOM position. All-or-nothing —
      the theme-scoping class is not separable from the container, so a portaled
      selector can never escape its theme. Omit for the default inline selector.
  - name: onChange
    type: "(e164: string | null, isValid: boolean) => void"
    description: Called with the E.164 number and its validity. e164 is null for anything that is not a complete, valid number — a partial is never emitted.
  - name: onBlur
    type: "(error: ValidationError | null) => void"
    description: Called on blur with the validation error for a non-empty, invalid number (otherwise null).

dependencies:
  - intl-tel-input
  - "@intl-tel-input/react"

preview_url: "https://visor.loworbit.studio/docs/components/form/phone-input"

example: |
  <PhoneInput
    name="phone"
    placeholder="Enter phone number"
    onChange={(e164, isValid) => {
      console.log(e164, isValid);
    }}
  />
