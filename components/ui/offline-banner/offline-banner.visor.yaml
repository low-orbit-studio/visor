name: OfflineBanner
description: App-shell sticky banner, or a compact top-bar pill, for network connectivity loss with offline, reconnecting, and restored states.
extends: HTMLDivElement
category: feedback

when_to_use:
  - When the app must signal network connectivity loss to the user non-intrusively
  - As the primary offline indicator below the navigation bar in a full-page shell
  - When stale data should remain visible and the app should remain navigable while offline
  - When you need a manual retry action that checks connectivity without forcing a page reload
  - As a small pill in a top bar (variant="pill"), with a detail such as when the page was saved

when_not_to_use:
  - For generic informational messages unrelated to network status (use Banner or Alert)
  - When the failure is a server error, not a connectivity issue (use Alert with error intent)
  - As an overlay that blocks content (use Dialog or a full-screen overlay instead)
  - For ephemeral success/failure notifications (use Toast)

why: >
  OfflineBanner implements the Borealis "offline shell banner" global state pattern.
  It uses sticky positioning below the nav bar, not an overlay, so stale data remains
  visible and navigable. The included useNetworkStatus hook drives the state machine
  (offline → reconnecting → restored → online) via browser online/offline events and
  an optional custom retry probe. All three states (offline, reconnecting, restored)
  are announced to assistive technology via aria-live="polite".

variants:
  networkState: [online, offline, reconnecting, restored]
  variant: [banner, pill]

props:
  - name: networkState
    type: "'online' | 'offline' | 'reconnecting' | 'restored'"
    required: true
  - name: onRetry
    type: "() => void"
  - name: offlineLabel
    type: string
    default: "You're offline"
  - name: reconnectingLabel
    type: string
    default: "Reconnecting…"
  - name: restoredLabel
    type: string
    default: "Back online"
  - name: retryLabel
    type: string
    default: "Retry"
  - name: variant
    type: "'banner' | 'pill'"
    default: "'banner'"
    description: >
      `pill` draws a compact inline pill for a top bar instead of the full-width sticky bar.
      Its offline label defaults to "Offline". Solid by default; inside data-glass="on" it
      reads the glass layer's control fill, ring, ink and blur.
  - name: detail
    type: React.ReactNode
    description: >
      Shown after the label as "· {detail}", lighter, e.g. "saved 9PM". With a detail the
      root drops its aria-label, so the status region reads the whole text.

theme_hooks:
  - name: --offline-banner-pill-height
    description: Pill height.
  - name: --offline-banner-pill-padding-x
    description: Pill horizontal padding.
  - name: --offline-banner-pill-gap
    description: Space between the icon, label and detail.
  - name: --offline-banner-pill-font-size
    description: Pill type size.
  - name: --offline-banner-pill-font-weight
    description: Label weight.
  - name: --offline-banner-pill-detail-font-weight
    description: Detail weight.
  - name: --offline-banner-pill-detail-opacity
    description: Detail opacity.
  - name: --offline-banner-pill-icon-size
    description: Icon size.
  - name: --offline-banner-pill-bg
    description: Solid pill fill.
  - name: --offline-banner-pill-text-color
    description: Pill ink (label, detail and icon).
  - name: --offline-banner-pill-border
    description: Solid pill edge colour.

dependencies:
  - "@phosphor-icons/react"

hooks:
  - name: useNetworkStatus
    description: >
      Hook that listens to window online/offline events and drives the OfflineBanner
      state machine. Accepts an optional onRetry callback for a custom connectivity probe.

preview_url: "https://visor.loworbit.studio/docs/components/feedback/offline-banner"

example: |
  const { networkState, retry } = useNetworkStatus();
  <OfflineBanner networkState={networkState} onRetry={retry} />
  <OfflineBanner networkState="offline" variant="pill" detail="saved 9PM" />
