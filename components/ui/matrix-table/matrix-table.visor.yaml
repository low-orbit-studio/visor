name: MatrixTable
description: A fixed assignment grid component for members×roles patterns. Sticky-left identity column, centered boolean cells (22px filled-success check when active / muted empty when not), and multi-line centered column headers (label over count) that opt out of the uppercase header treatment. No list machinery — no selection column, no sort buttons, no pagination footer.
extends: HTMLDivElement
category: admin

when_to_use:
  - Displaying a members × roles assignment matrix in organization settings
  - Any fixed grid where rows are identities (users, items) and columns are boolean attributes (permissions, roles, features)
  - When the shape is a matrix, not a sortable/pageable list — where DataTable's list machinery would fight the layout

when_not_to_use:
  - Sortable, paginated lists of records (use DataTable)
  - Editable grids with input cells (extend or build a dedicated grid)
  - Simple key-value tables (use the Table primitive directly)

why: >
  The roles-table screen's core is a members×roles matrix that the TanStack DataTable
  (a sortable/paginated/selectable list) cannot reproduce without the list machinery
  actively fighting the matrix shape. MatrixTable provides a minimal, data-driven API
  (columns + rows + renderIdentity) with all the visual affordances the pattern needs:
  sticky-left identity column with hover-tracking background, centered boolean
  indicators (22px circular filled-success check / muted empty circle), and
  multi-line centered column headers. Theme-agnostic — references only CSS custom
  property tokens, no hard-coded values.

variants: {}

props:
  - name: columns
    type: "MatrixColumn[]"
    required: true
    description: Column definitions. Each column has an `id`, `label`, and optional `count` sub-label rendered below the label in the header.
  - name: rows
    type: "MatrixRow<TIdentity>[]"
    required: true
    description: Row data. Each row has an `id`, an `identity` value passed to `renderIdentity`, and an `activeColumns` set/array of column ids that should show the active check indicator.
  - name: renderIdentity
    type: "(identity: TIdentity) => React.ReactNode"
    required: true
    description: Render slot for the sticky-left identity cell. Receives the row's `identity` value — typically renders a name, avatar+name, or any identity compound.
  - name: aria-label
    type: string
    description: Accessible label for the table element.

dependencies:
  - "@phosphor-icons/react"
  - "@loworbitstudio/visor-core"

preview_url: "https://visor.loworbit.studio/docs/components/admin/matrix-table"

example: |
  const columns: MatrixColumn[] = [
    { id: 'admin', label: 'Admin', count: 3 },
    { id: 'editor', label: 'Editor', count: 5 },
    { id: 'viewer', label: 'Viewer', count: 12 },
  ]

  const rows: MatrixRow<{ name: string; email: string }>[] = [
    { id: '1', identity: { name: 'Ada Lovelace', email: 'ada@example.com' }, activeColumns: new Set(['admin', 'editor']) },
    { id: '2', identity: { name: 'Grace Hopper', email: 'grace@example.com' }, activeColumns: ['viewer'] },
  ]

  <MatrixTable
    columns={columns}
    rows={rows}
    renderIdentity={(identity) => <span>{identity.name}</span>}
    aria-label="Member role assignments"
  />
