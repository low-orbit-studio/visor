name: Badge
description: A small label component for status indicators, counts, and tags with multiple visual variants.
extends: HTMLSpanElement
category: data-display

when_to_use:
  - Status indicators (active, pending, error) next to items
  - Notification counts or unread message badges
  - Tags or labels on cards, tables, or list items
  - Category or type indicators in search results

when_not_to_use:
  - Clickable filter chips (use ToggleGroup)
  - Dismissible tags with a close button (use a custom tag component)
  - Full-width alert banners (use Alert or Banner)
  - Decorative icons without text meaning (use an icon directly)

why: >
  Badge provides twelve semantic variants across tonal and filled styles — default,
  secondary, outline, neutral, destructive, success, warning, info, and filled versions of
  the semantic states. The consistent pill shape, font sizing, and color tokens keep
  badges readable at small sizes. Focus ring support means badges can be interactive
  when wrapped in buttons or links.

variants:
  variant: [default, secondary, outline, neutral, destructive, success, warning, info, filled-destructive, filled-success, filled-warning, filled-info, filled-neutral]
  size: [sm, md, lg]

props:
  - name: variant
    type: '"default" | "secondary" | "outline" | "neutral" | "destructive" | "success" | "warning" | "info" | "filled-destructive" | "filled-success" | "filled-warning" | "filled-info" | "filled-neutral"'
    default: '"default"'
  - name: size
    type: '"sm" | "md" | "lg"'
    default: '"md"'
    description: >
      Controls token-driven padding, font-size, gap, and embedded-icon scaling.
      `md` (the default) reproduces the original badge sizing exactly — existing
      call sites are unchanged. `sm` is tighter for dense inline data contexts;
      `lg` is larger for editorial contexts like page headers and stat-card
      status pills. Icons inside the badge scale with the size step.

dependencies:
  - "class-variance-authority"

preview_url: "https://visor.loworbit.studio/docs/components/data-display/badge"

example: |
  <Badge variant="default">Active</Badge>
  <Badge variant="secondary">Secondary</Badge>
  <Badge variant="outline">v2.1.0</Badge>
  <Badge variant="neutral">Draft</Badge>
  <Badge variant="destructive">Error</Badge>
  <Badge variant="success">Published</Badge>
  <Badge variant="warning">Pending</Badge>
  <Badge variant="info">Beta</Badge>
  <Badge variant="filled-destructive">Critical</Badge>

  {/* Sizes — sm for dense inline data, md (default) inline, lg for headers/pills */}
  <Badge size="sm" variant="secondary">v2.1.0</Badge>
  <Badge size="md" variant="success">Published</Badge>
  <Badge size="lg" variant="info">Beta</Badge>
