name: ConfirmDialog
description: Admin confirmation dialog compound wrapping Dialog with severity-driven icon/color/button variant, an editorial icon-treatment + render-mode API, optional confirm-text gate, and async-aware confirm handler.
extends: Dialog
category: admin

when_to_use:
  - Confirming a destructive action like delete, revoke, or purge
  - Gating a high-stakes action with a typed confirmation phrase
  - Surfacing a pending state during async confirm handlers
  - Replacing inline "are you sure?" prompts in admin UIs

when_not_to_use:
  - Informational modals without an action (use Dialog directly)
  - Inline form confirmation (use Field validation)
  - Toasts or banners for non-blocking confirmations
  - Multi-step wizard confirmations (use a dedicated flow)

why: >
  Destructive-action confirmation is ubiquitous in admin UIs — delete user,
  cancel subscription, revoke API key, purge data. Canonicalizing the pattern
  into a single compound gives us consistent icon/color semantics per severity,
  a safer default focus target on danger, and an opinionated confirm-text gate
  for irreversible operations.

variants:
  severity: [info, warning, destructive]
  severity_deprecated: [danger]  # "danger" is a deprecated alias for "destructive" — use "destructive" instead
  iconTreatment: [inline, plated]  # unset = canonical default tinted plate stacked above the title
  mode: [dialog, inline]  # "dialog" = Radix portal + overlay; "inline" = non-portal surface for stacking in a shared scrim

props:
  - name: title
    type: React.ReactNode
    required: true
    description: Dialog title. Rendered below the severity icon plate in the dialog header.
  - name: description
    type: React.ReactNode
    description: Short body above the action row. Used as DialogDescription for aria-describedby.
  - name: children
    type: React.ReactNode
    description: Richer body slot. Overrides description when provided.
  - name: severity
    type: "'info' | 'warning' | 'destructive' | 'danger'"
    default: "warning"
    description: >
      Drives icon, tinted icon plate, and confirm button variant.
      Use "info", "warning", or "destructive". The value "danger" is a
      deprecated alias for "destructive" and will be removed in the next
      major version.
  - name: icon
    type: React.ReactNode
    description: >
      Custom severity icon — overrides the built-in icon for the active
      severity. Sizing/color is handled by the icon container, so pass a bare
      Phosphor icon (no explicit size).
  - name: iconTreatment
    type: "'inline' | 'plated'"
    description: >
      Severity-icon treatment. Leave unset for the canonical default — a tinted
      circular plate stacked above the title. Set "plated" for a 40px color-mix
      severity plate leading the title column, or "inline" for a small leading
      icon next to the title. Default rendering (unset) is unchanged.
  - name: mode
    type: "'dialog' | 'inline'"
    default: "dialog"
    description: >
      Rendering mode. "dialog" uses Radix Dialog + Portal + Overlay + auto
      X-close. "inline" renders only the content surface (no portal, no overlay,
      no X-close) so multiple dialogs can stack inside one shared scrim.
  - name: cancelVariant
    type: ButtonProps["variant"]
    default: "outline"
    description: Cancel button variant. Golden editorial screens use "ghost".
  - name: trigger
    type: React.ReactNode
    description: Optional trigger wrapped in DialogTrigger. Omit for fully-controlled usage.
  - name: open
    type: boolean
    description: Controlled open state.
  - name: defaultOpen
    type: boolean
    description: Uncontrolled initial open state.
  - name: onOpenChange
    type: "(open: boolean) => void"
    description: Called when open state changes.
  - name: confirmLabel
    type: React.ReactNode
    description: Confirm button label. Defaults to "Delete" for destructive/danger severity, "Confirm" otherwise.
  - name: cancelLabel
    type: React.ReactNode
    default: "Cancel"
    description: Cancel button label.
  - name: confirmText
    type: string
    description: If set, the user must type this exact string to enable the confirm button.
  - name: confirmTextLabel
    type: React.ReactNode
    description: Label for the confirm-text input. Defaults to "Type {confirmText} to confirm".
  - name: onConfirm
    type: "() => void | Promise<void>"
    description: Confirm handler. Returning a Promise enables pending state and keeps the dialog open until resolved.
  - name: onCancel
    type: "() => void"
    description: Cancel handler.
  - name: busy
    type: boolean
    description: Externally-controlled busy state. Overrides internal async pending detection.

dependencies:
  - "@radix-ui/react-dialog"
  - "@phosphor-icons/react"

preview_url: "https://visor.loworbit.studio/docs/components/admin/confirm-dialog"

example: |
  <ConfirmDialog
    trigger={<Button variant="destructive">Delete project</Button>}
    severity="destructive"
    title="Delete project?"
    description="This action cannot be undone. All associated data will be permanently removed."
    confirmText="acme"
    onConfirm={async () => {
      await deleteProject()
    }}
  />
