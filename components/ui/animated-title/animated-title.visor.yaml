name: AnimatedTitle
description: A title drawn word by word in CSS. Each word rises, unblurs or settles its weight in turn; screen readers read the whole title once.
extends: HTMLElement
category: typography

when_to_use:
  - A slide, sheet or section title that should arrive with the page (an intro slide, an edit sheet, a timeline day)
  - A short title (a few words) where a staggered entrance reads as one phrase

when_not_to_use:
  - Body copy or long headings that wrap over many lines (use Heading or Text)
  - A title that changes while it is on screen and must not replay (use Heading)
  - Text that has to leave with an exit animation (CSS can't animate an unmount; wrap it in your own motion item)

why: >
  Lifted from the Honcho kit's TitleWords, rebuilt with CSS keyframes and a
  per-word animation-delay instead of the motion library, so Visor gains no
  animation dependency and server and client markup match. Each word is an
  inline-block span; word i starts at delay + i × stagger. The plain title
  sits in a visually hidden copy and the animated words are aria-hidden, so a
  screen reader hears the title once. Durations and staggers are the kit's
  numbers as AnimatedTitle's own settings; the curve is the theme's enter
  easing. Under prefers-reduced-motion the title shows settled, with no
  animation.

props:
  - name: text
    type: string
    required: true
    description: The title. Split into words on single spaces.
  - name: as
    type: "'h1' | 'h2' | 'h3' | 'h4' | 'h5' | 'h6' | 'p' | 'span'"
    default: "'h2'"
    description: The element to render.
  - name: animation
    type: "'rise' | 'blur' | 'weight'"
    default: "'blur'"
    description: >-
      rise slides each word up out of a mask (1.05s, 55ms apart); blur lifts it
      6px into focus from a 14px blur (1.1s, 60ms apart); weight fades it in
      from weight 300 to 520 (1.3s, 50ms apart).
  - name: format
    type: "(word: string) => ReactNode"
    description: Draws each word, for example swapping hyphens for dashes. Default, the word as is.
  - name: play
    type: boolean
    default: "true"
    description: false holds every word on its first frame. Replay by changing the component's key.
  - name: delay
    type: number
    default: "0"
    description: Milliseconds before the first word starts. Sets --animated-title-delay.

customization:
  description: >
    Set these on the title or any ancestor. The defaults are the kit's numbers,
    intentionally not motion-scale steps, so the title moves the same in every
    theme. The curve reads --motion-easing-enter.
  properties:
    - name: --animated-title-duration
      default: "1.05s (rise), 1.1s (blur), 1.3s (weight)"
      description: Each word's run.
    - name: --animated-title-stagger
      default: "55ms (rise), 60ms (blur), 50ms (weight)"
      description: The gap between one word's start and the next.
    - name: --animated-title-delay
      default: 0ms
      description: Before the first word starts. The delay prop sets it.

dependencies: []

preview_url: "https://visor.loworbit.studio/docs/components/typography/animated-title"

example: |
  <AnimatedTitle as="h1" text="Tell us about your weekend" />

  <AnimatedTitle text="Edit your arrival" animation="rise" delay={120} />

  <AnimatedTitle text="Friday night" animation="weight" play={ready} />
