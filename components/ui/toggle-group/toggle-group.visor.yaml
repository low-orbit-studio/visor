name: Toggle Group
description: A toggle group component with single-select and multi-select modes using CVA variants.
extends: HTMLDivElement
category: form

when_to_use:
  - Switching between mutually exclusive views or modes (grid/list, day/week/month)
  - Selecting one or multiple options from a small set of 2-5 choices
  - Toolbar-style option groups with icon or text items

when_not_to_use:
  - Navigation between pages or routes (use Tabs)
  - Binary on/off toggle (use Switch)
  - Selecting from a long list (use Select or Combobox)
  - Form submission with radio-style semantics (use Radio Group)

why: >
  ToggleGroup wraps Radix UI ToggleGroup to provide accessible single-select
  or multi-select behavior with keyboard navigation. It supports two visual
  variants (default and outline) and three sizes via CVA. Items visually
  indicate their pressed state with distinct background and text colors.

variants:
  variant: [default, outline]
  size: [xs, sm, md, lg]

theme_hooks:
  - name: --toggle-group-track-bg
    description: >
      Outline track fill. Falls back to transparent, at zero specificity so a
      consumer class still wins. Theme key: components.toggle-group.track-bg.
  - name: --toggle-group-selected-bg
    description: >
      Selected option fill (the sliding indicator, or the item itself in the
      default variant and in a multiple group). Falls back to
      var(--interactive-primary-bg, var(--primary, #111827)). Theme key:
      components.toggle-group.selected-bg.
  - name: --toggle-group-selected-text
    description: >
      Selected option ink. Falls back to var(--interactive-primary-text, #f9fafb).
      Theme key: components.toggle-group.selected-text.
  - name: --toggle-group-unselected-text
    description: >
      Unselected option ink. Falls back to var(--text-primary, #111827). Theme
      key: components.toggle-group.unselected-text.
  - name: --toggle-group-xs-font-size
    description: >
      Compact (xs) label size. Falls back to var(--font-size-xs, 0.75rem). Theme
      key: components.toggle-group.xs-font-size.
  - name: --toggle-group-xs-padding-x
    description: >
      Compact (xs) option sides. Falls back to var(--spacing-2, 0.5rem). Theme
      key: components.toggle-group.xs-padding-x.
  - name: --toggle-group-xs-track-radius
    description: >
      Compact (xs) outline track corners. Falls back to var(--radius-md, 0.375rem).
      Theme key: components.toggle-group.xs-track-radius.
  - name: --toggle-group-xs-item-radius
    description: >
      Compact (xs) option and indicator corners; concentric is the track radius
      minus its 2px inset. Falls back to var(--radius-sm, 0.25rem). Theme key:
      components.toggle-group.xs-item-radius.

props:
  - name: type
    type: "'single' | 'multiple'"
    description: Whether one or multiple items can be pressed at a time
  - name: variant
    type: "'default' | 'outline'"
    default: "default"
  - name: size
    type: "'xs' | 'sm' | 'md' | 'lg'"
    default: "md"
  - name: value
    type: "string | string[]"
    description: Controlled selected value(s)
  - name: defaultValue
    type: "string | string[]"
  - name: onValueChange
    type: "(value: string | string[]) => void"
  - name: disabled
    type: boolean
    default: false

sub_components:
  - name: ToggleGroupItem
    description: An individual toggle item. Accepts variant and size props to override the group defaults.

dependencies:
  - "@radix-ui/react-toggle-group"
  - "class-variance-authority"

preview_url: "https://visor.loworbit.studio/docs/components/form/toggle-group"

example: |
  <ToggleGroup type="single" defaultValue="grid" variant="outline">
    <ToggleGroupItem value="grid">Grid</ToggleGroupItem>
    <ToggleGroupItem value="list">List</ToggleGroupItem>
  </ToggleGroup>
